apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: shipops
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: frontend.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 5002
      - path: /api/shipments
        pathType: Prefix
        backend:
          service:
            name: shipment-service
            port:
              number: 5000
      - path: /api/cargo
        pathType: Prefix
        backend:
          service:
            name: shipment-service
            port:
              number: 5000
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 5001
      - path: /documents
        pathType: Prefix
        backend:
          service:
            name: documents-service
            port:
              number: 5000
      - path: /dashboard
        pathType: Prefix
        backend:
          service:
            name: documents-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
