apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: shipops
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # HTTP-only listener (no certificate required). To enable HTTPS add a certificate ARN and change listen-ports.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
spec:
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: core-service
            port:
              number: 5002
      - path: /api/shipments
        pathType: Prefix
        backend:
          service:
            name: shipment-service
            port:
              number: 5000
      - path: /api/cargo
        pathType: Prefix
        backend:
          service:
            name: shipment-service
            port:
              number: 5000
      - path: /api/v1/ai
        pathType: Prefix
        backend:
          service:
            name: ai-service
            port:
              number: 5005
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 5001
      - path: /documents
        pathType: Prefix
        backend:
          service:
            name: documents-service
            port:
              number: 5000
      - path: /dashboard
        pathType: Prefix
        backend:
          service:
            name: documents-service
            port:
              number: 5000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
