apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core-postgres
  namespace: shipops
spec:
  serviceName: core-postgres
  replicas: 1
  selector:
    matchLabels:
      app: core-postgres
  template:
    metadata:
      labels:
        app: core-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: core_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi