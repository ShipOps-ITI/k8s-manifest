apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ShipOps-ITI/auth-service.git
    targetRevision: main
    path: k8s                

  destination:
    server: https://kubernetes.default.svc
    namespace: shipops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
