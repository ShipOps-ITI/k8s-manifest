apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: shipops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: shahdmohammed077/ai-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5005
          env:
            - name: PORT
              value: "5005"
            - name: AI_MODEL
              value: "google/gemma-4-26b-a4b-it:free"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-secret
                  key: OPENROUTER_API_KEY
            - name: CORE_SERVICE_URL
              value: "http://core-service:5002/api/v1"
            - name: SHIPMENT_SERVICE_URL
              value: "http://shipment-service:5000/api/shipments"
            # Replace this with the public origin that serves the frontend.
            - name: FRONTEND_ORIGIN
              value: "http://localhost:5173"
