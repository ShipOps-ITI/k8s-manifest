apiVersion: batch/v1
kind: Job
metadata:
  name: auth-prisma-migrate
  namespace: shipops
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: 760402325804.dkr.ecr.us-east-1.amazonaws.com/shipops/auth:latest
        imagePullPolicy: Always
        command: ["npx", "prisma", "migrate", "deploy"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: DATABASE_URL
