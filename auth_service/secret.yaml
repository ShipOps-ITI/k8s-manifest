# Real values are injected by CI via kubectl from GitHub Actions secrets.
# Only sensitive credentials live here — non-sensitive Paymob config is in paymob-config.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: shipops
type: Opaque
stringData:
  DATABASE_URL: "INJECTED_BY_CI"
  JWT_SECRET: "INJECTED_BY_CI"
  JWT_EXPIRES_IN: "INJECTED_BY_CI"
  REFRESH_TOKEN_SECRET: "INJECTED_BY_CI"
  FRONTEND_ORIGIN: "INJECTED_BY_CI"
  PAYMOB_API_KEY: "INJECTED_BY_CI"
  PAYMOB_SECRET_KEY: "INJECTED_BY_CI"
  PAYMOB_PUBLIC_KEY: "INJECTED_BY_CI"
