apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: shipops

spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:

      containers:

      - name: auth-service

        image: shipops46/auth-service:v4

        imagePullPolicy: IfNotPresent

        ports:
        - containerPort: 5001

        env:
        - name: PORT
          value: "5001"

        - name: NODE_ENV
          value: "production"

        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: DATABASE_URL

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: JWT_SECRET

        - name: REFRESH_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: REFRESH_TOKEN_SECRET
        - name: FRONTEND_ORIGIN
          value: "http://localhost:5173"
        - name: FRONTEND_URL
          value: "http://localhost:5173"
        - name: PAYMOB_BASE_URL
          value: "https://accept.paymob.com"
        - name: PAYMOB_CURRENCY
          value: "EGP"
        - name: PAYMOB_PREMIUM_AMOUNT_CENTS
          value: "10000"
        - name: PAYMOB_REDIRECTION_URL
          value: "http://localhost:5173/payment/success"
        - name: PAYMOB_API_KEY
          valueFrom:
            secretKeyRef:
              name: auth-payment-secret
              key: PAYMOB_API_KEY
              optional: true
        - name: PAYMOB_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-payment-secret
              key: PAYMOB_SECRET_KEY
              optional: true
        - name: PAYMOB_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: auth-payment-secret
              key: PAYMOB_PUBLIC_KEY
              optional: true
        - name: PAYMOB_3DS_INTEGRATION_ID
          valueFrom:
            secretKeyRef:
              name: auth-payment-secret
              key: PAYMOB_3DS_INTEGRATION_ID
              optional: true
        - name: PAYMOB_MOTO_INTEGRATION_ID
          valueFrom:
            secretKeyRef:
              name: auth-payment-secret
              key: PAYMOB_MOTO_INTEGRATION_ID
              optional: true
        - name: PAYMOB_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: auth-payment-secret
              key: PAYMOB_WEBHOOK_URL
              optional: true
        - name: PAYMOB_WEBHOOK_TOKEN
          valueFrom:
            secretKeyRef:
              name: auth-payment-secret
              key: PAYMOB_WEBHOOK_TOKEN
              optional: true
        - name: PAYMOB_YEARLY_PLAN_ID
          valueFrom:
            secretKeyRef:
              name: auth-payment-secret
              key: PAYMOB_YEARLY_PLAN_ID
              optional: true
