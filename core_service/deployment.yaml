apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: shipops

spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
      - name: core-service
        image: ahmedyasser02/core-service:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5002
        env:
        - name: PORT
          value: "5002"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: core-service-secret
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: JWT_SECRET
        - name: REFRESH_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-secret
              key: REFRESH_TOKEN_SECRET
