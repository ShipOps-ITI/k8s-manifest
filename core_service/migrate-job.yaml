apiVersion: batch/v1
kind: Job
metadata:
  name: core-prisma-migrate
  namespace: shipops
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: ahmedyasser02/core-service:v1
        imagePullPolicy: IfNotPresent
        command: ["npx", "prisma", "migrate", "deploy"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: core-service-secret
              key: DATABASE_URL
