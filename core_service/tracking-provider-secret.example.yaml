# Do not commit a real API key. Create the real Secret with kubectl instead:
# kubectl create secret generic tracking-provider-secret -n shipops \
#   --from-literal=VESSELAPI_KEY='your_vesselapi_key'
apiVersion: v1
kind: Secret
metadata:
  name: tracking-provider-secret
  namespace: shipops
type: Opaque
stringData:
  VESSELAPI_KEY: replace_with_your_vesselapi_key
